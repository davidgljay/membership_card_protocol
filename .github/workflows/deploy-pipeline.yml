name: Deploy Pipeline

# Phase 4 (plans/deployment/implementation-plan.md): test -> deploy-dev ->
# dev-tests -> deploy-prod, in order, each stage gating the next.
#
# `deploy-prod` targets the `prod` GitHub Environment, which MUST have a
# required-reviewers protection rule configured (Settings -> Environments
# -> prod -> "Required reviewers") before this workflow can auto-deploy to
# production on a push to main -- per implementation-plan.md's Phase 4
# clarification checkpoint, prod deploys are not meant to be fully
# automatic without that gate. This workflow does not and cannot configure
# that rule itself (a GitHub repo-settings change, not something this file
# controls) -- set it up yourself before relying on this pipeline for prod.
#
# Also note: as of this writing, wallet-service's prod deployment is
# explicitly blocked pending CP-3's independent security review (see
# wallet-service/DEPLOYMENT.md), and no real prod infrastructure exists yet
# for relay (Droplet's prod tier not brought up) or contracts (mainnet
# never deployed). `deploy-prod` is fully wired here but will fail loudly
# against real secrets until that infrastructure actually exists -- expected,
# not a bug in this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    uses: ./.github/workflows/integration-tests.yml

  deploy-dev:
    name: Deploy (dev)
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    # id-token: write is required for npm Trusted Publishing (OIDC) --
    # these packages are configured on npmjs.com to only accept publishes
    # via their registered trusted publisher, not a classic token. Same
    # permission also covers provenance attestation, which Trusted
    # Publishing generates automatically (see
    # scripts/publish-npm-package.sh). Same pattern as publish-verifier.yml's
    # existing job.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # registry-url is required even under Trusted Publishing (npm docs'
      # own recommended workflow keeps it) -- it's how actions/setup-node
      # tells npm which registry to request an OIDC token for, not just a
      # token-auth concern. NODE_AUTH_TOKEN is deliberately NOT set below:
      # these packages have npm Trusted Publishing configured, which
      # requires token auth to be absent, not just unused -- npm rejects a
      # token-bearing publish attempt with a 404 (not a clearer 403) when
      # the package only allows its trusted publisher. Confirmed live
      # across two failed runs before landing on this. See
      # scripts/publish-npm-package.sh's matching comment.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) needs npm CLI >= 11.5.1 to know how to
      # request an id-token at all -- the bundled npm on the node:22 runner
      # image is 10.9.8. Without this, npm silently publishes with no auth
      # (not even a clear auth error), which the registry rejects as
      # anonymous -- surfaces as the same misleading E404 as the missing-
      # NODE_AUTH_TOKEN case above. Confirmed live.
      - name: Upgrade npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: scripts/deploy-all.sh dev
        env:
          # --- press ---
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRESS_CARD_CID: ${{ vars.PRESS_CARD_CID }}
          PRESS_POLICY_CIDS: ${{ vars.PRESS_POLICY_CIDS }}
          PRESS_MLDSA44_PRIVATE_KEY: ${{ secrets.PRESS_MLDSA44_PRIVATE_KEY }}
          PRESS_SECP256R1_PRIVATE_KEY: ${{ secrets.PRESS_SECP256R1_PRIVATE_KEY }}
          PRESS_GAS_WALLET_PRIVATE_KEY: ${{ secrets.PRESS_GAS_WALLET_PRIVATE_KEY }}
          PRESS_OHTTP_PRIVATE_KEY: ${{ secrets.PRESS_OHTTP_PRIVATE_KEY }}
          ARBITRUM_RPC_URL: ${{ vars.ARBITRUM_RPC_URL }}
          # press's REGISTRY_CONTRACT_ADDRESS is the LOGIC contract;
          # wallet-service's REGISTRY_CONTRACT_ADDRESS is the STORAGE
          # contract -- same env var name, different meaning per service
          # (see relay/DEPLOYMENT.md's naming-landmine note). deploy-all.sh
          # reads these split, service-scoped names and maps each to the
          # right service's REGISTRY_CONTRACT_ADDRESS itself -- don't set a
          # bare REGISTRY_CONTRACT_ADDRESS here, it would be ambiguous.
          REGISTRY_CONTRACT_ADDRESS_LOGIC: ${{ vars.REGISTRY_CONTRACT_ADDRESS_LOGIC }}
          REGISTRY_CONTRACT_ADDRESS_STORAGE: ${{ vars.REGISTRY_CONTRACT_ADDRESS_STORAGE }}
          STORAGE_CONTRACT_ADDRESS: ${{ vars.REGISTRY_CONTRACT_ADDRESS_STORAGE }}
          FILEBASE_KEY: ${{ secrets.FILEBASE_KEY }}
          FILEBASE_SECRET: ${{ secrets.FILEBASE_SECRET }}
          FILEBASE_BUCKET: ${{ vars.FILEBASE_BUCKET }}
          PRESS_ADMIN_API_KEY: ${{ secrets.PRESS_ADMIN_API_KEY }}

          # --- wallet-service ---
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRETS_BACKEND: ${{ vars.SECRETS_BACKEND }}
          WEBCRYPTO_MASTER_KEY: ${{ secrets.WEBCRYPTO_MASTER_KEY }}
          SESSION_TOKEN_SECRET: ${{ secrets.SESSION_TOKEN_SECRET }}
          KV_BACKEND: ${{ vars.KV_BACKEND }}
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          WEBAUTHN_ORIGIN: ${{ vars.WEBAUTHN_ORIGIN }}
          WALLET_SERVICE_ID: ${{ vars.WALLET_SERVICE_ID }}
          WALLET_SERVICE_ENDPOINT: ${{ vars.WALLET_SERVICE_ENDPOINT }}
          WALLET_SERVICE_PRIVATE_KEY: ${{ secrets.WALLET_SERVICE_PRIVATE_KEY }}
          PEER_LIST: ${{ vars.PEER_LIST }}
          RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}

          # --- relay (Droplet over SSH) ---
          DROPLET_SSH_HOST: ${{ secrets.DROPLET_SSH_HOST }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
        run: ./scripts/deploy-all.sh dev

  dev-tests:
    name: dev-tests
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dev-tests/package-lock.json

      - name: Install dependencies
        working-directory: dev-tests
        run: npm ci

      # Materializes dev-tests/.env from this environment's secrets/vars,
      # matching dev-tests/.env.example's shape exactly (see that file for
      # what each variable is). Never echoed -- GitHub Actions masks
      # secret values in logs automatically, but the file itself is not
      # printed here regardless.
      - name: Write dev-tests/.env
        working-directory: dev-tests
        env:
          DEV_PRESS_URL: ${{ vars.DEV_PRESS_URL }}
          DEV_WALLET_SERVICE_URL: ${{ vars.DEV_WALLET_SERVICE_URL }}
          DEV_RELAY_URL: ${{ vars.DEV_RELAY_URL }}
          DEV_ARBITRUM_RPC_URL: ${{ vars.DEV_ARBITRUM_RPC_URL }}
          DEV_REGISTRY_CONTRACT_ADDRESS: ${{ vars.REGISTRY_CONTRACT_ADDRESS_STORAGE }}
          DEV_LOGIC_CONTRACT_ADDRESS: ${{ vars.REGISTRY_CONTRACT_ADDRESS_LOGIC }}
          DEV_IPFS_GATEWAY_URL: ${{ vars.DEV_IPFS_GATEWAY_URL }}
          DEV_PRESS_ADMIN_API_KEY: ${{ secrets.PRESS_ADMIN_API_KEY }}
          DEV_TESTS_DNS_GOV_PRIVKEY_1: ${{ secrets.DEV_TESTS_DNS_GOV_PRIVKEY_1 }}
          DEV_TESTS_DNS_GOV_PRIVKEY_2: ${{ secrets.DEV_TESTS_DNS_GOV_PRIVKEY_2 }}
          DEV_TESTS_DNS_GOV_PRIVKEY_3: ${{ secrets.DEV_TESTS_DNS_GOV_PRIVKEY_3 }}
          DEV_TESTS_POLICY_GOV_PRIVKEY_1: ${{ secrets.DEV_TESTS_POLICY_GOV_PRIVKEY_1 }}
          DEV_TESTS_POLICY_GOV_PRIVKEY_2: ${{ secrets.DEV_TESTS_POLICY_GOV_PRIVKEY_2 }}
          DEV_TESTS_POLICY_GOV_PRIVKEY_3: ${{ secrets.DEV_TESTS_POLICY_GOV_PRIVKEY_3 }}
          DEV_TESTS_PRESS_GOV_PRIVKEY_1: ${{ secrets.DEV_TESTS_PRESS_GOV_PRIVKEY_1 }}
          DEV_TESTS_PRESS_GOV_PRIVKEY_2: ${{ secrets.DEV_TESTS_PRESS_GOV_PRIVKEY_2 }}
          DEV_TESTS_PRESS_GOV_PRIVKEY_3: ${{ secrets.DEV_TESTS_PRESS_GOV_PRIVKEY_3 }}
          DEV_TESTS_GAS_WALLET_PRIVATE_KEY: ${{ secrets.DEV_TESTS_GAS_WALLET_PRIVATE_KEY }}
          DEV_TESTS_PRESS_SECP256R1_PRIVATE_KEY: ${{ secrets.DEV_TESTS_PRESS_SECP256R1_PRIVATE_KEY }}
          DEV_TESTS_PRESS_SECP256R1_PUBLIC_KEY: ${{ vars.DEV_TESTS_PRESS_SECP256R1_PUBLIC_KEY }}
          DEV_TESTS_PRESS_MLDSA44_PUBLIC_KEY: ${{ vars.DEV_TESTS_PRESS_MLDSA44_PUBLIC_KEY }}
          FILEBASE_KEY: ${{ secrets.FILEBASE_KEY }}
          FILEBASE_SECRET: ${{ secrets.FILEBASE_SECRET }}
          FILEBASE_BUCKET: ${{ vars.FILEBASE_BUCKET }}
          DEV_TESTS_POLICY_ID: ${{ vars.DEV_TESTS_POLICY_ID }}
          DEV_TESTS_POLICY_ADDRESS: ${{ vars.DEV_TESTS_POLICY_ADDRESS }}
          DEV_RELAY_KNOWN_APP_ID: ${{ vars.DEV_RELAY_KNOWN_APP_ID }}
          DEV_RELAY_KNOWN_TARGET_ID: ${{ vars.DEV_RELAY_KNOWN_TARGET_ID }}
          DEV_SYNAPSE_URL: ${{ vars.DEV_SYNAPSE_URL }}
          DEV_MATRIX_SERVER_NAME: ${{ vars.DEV_MATRIX_SERVER_NAME }}
          DEV_MATRIX_ENFORCEMENT_USER_ID: ${{ vars.DEV_MATRIX_ENFORCEMENT_USER_ID }}
          DEV_MATRIX_AS_TOKEN: ${{ secrets.DEV_MATRIX_AS_TOKEN }}
        run: |
          {
            echo "export DEV_PRESS_URL=\"$DEV_PRESS_URL\""
            echo "export DEV_WALLET_SERVICE_URL=\"$DEV_WALLET_SERVICE_URL\""
            echo "export DEV_RELAY_URL=\"$DEV_RELAY_URL\""
            echo "export DEV_ARBITRUM_RPC_URL=\"$DEV_ARBITRUM_RPC_URL\""
            echo "export DEV_REGISTRY_CONTRACT_ADDRESS=\"$DEV_REGISTRY_CONTRACT_ADDRESS\""
            echo "export DEV_LOGIC_CONTRACT_ADDRESS=\"$DEV_LOGIC_CONTRACT_ADDRESS\""
            echo "export DEV_IPFS_GATEWAY_URL=\"$DEV_IPFS_GATEWAY_URL\""
            echo "export DEV_PRESS_ADMIN_API_KEY=\"$DEV_PRESS_ADMIN_API_KEY\""
            echo "export DEV_TESTS_DNS_GOV_PRIVKEY_1=\"$DEV_TESTS_DNS_GOV_PRIVKEY_1\""
            echo "export DEV_TESTS_DNS_GOV_PRIVKEY_2=\"$DEV_TESTS_DNS_GOV_PRIVKEY_2\""
            echo "export DEV_TESTS_DNS_GOV_PRIVKEY_3=\"$DEV_TESTS_DNS_GOV_PRIVKEY_3\""
            echo "export DEV_TESTS_POLICY_GOV_PRIVKEY_1=\"$DEV_TESTS_POLICY_GOV_PRIVKEY_1\""
            echo "export DEV_TESTS_POLICY_GOV_PRIVKEY_2=\"$DEV_TESTS_POLICY_GOV_PRIVKEY_2\""
            echo "export DEV_TESTS_POLICY_GOV_PRIVKEY_3=\"$DEV_TESTS_POLICY_GOV_PRIVKEY_3\""
            echo "export DEV_TESTS_PRESS_GOV_PRIVKEY_1=\"$DEV_TESTS_PRESS_GOV_PRIVKEY_1\""
            echo "export DEV_TESTS_PRESS_GOV_PRIVKEY_2=\"$DEV_TESTS_PRESS_GOV_PRIVKEY_2\""
            echo "export DEV_TESTS_PRESS_GOV_PRIVKEY_3=\"$DEV_TESTS_PRESS_GOV_PRIVKEY_3\""
            echo "export DEV_TESTS_GAS_WALLET_PRIVATE_KEY=\"$DEV_TESTS_GAS_WALLET_PRIVATE_KEY\""
            echo "export DEV_TESTS_PRESS_SECP256R1_PRIVATE_KEY=\"$DEV_TESTS_PRESS_SECP256R1_PRIVATE_KEY\""
            echo "export DEV_TESTS_PRESS_SECP256R1_PUBLIC_KEY=\"$DEV_TESTS_PRESS_SECP256R1_PUBLIC_KEY\""
            echo "export DEV_TESTS_PRESS_MLDSA44_PUBLIC_KEY=\"$DEV_TESTS_PRESS_MLDSA44_PUBLIC_KEY\""
            echo "export FILEBASE_KEY=\"$FILEBASE_KEY\""
            echo "export FILEBASE_SECRET=\"$FILEBASE_SECRET\""
            echo "export FILEBASE_BUCKET=\"$FILEBASE_BUCKET\""
            echo "export DEV_TESTS_POLICY_ID=\"$DEV_TESTS_POLICY_ID\""
            echo "export DEV_TESTS_POLICY_ADDRESS=\"$DEV_TESTS_POLICY_ADDRESS\""
            echo "export DEV_RELAY_KNOWN_APP_ID=\"$DEV_RELAY_KNOWN_APP_ID\""
            echo "export DEV_RELAY_KNOWN_TARGET_ID=\"$DEV_RELAY_KNOWN_TARGET_ID\""
            echo "export DEV_SYNAPSE_URL=\"$DEV_SYNAPSE_URL\""
            echo "export DEV_MATRIX_SERVER_NAME=\"$DEV_MATRIX_SERVER_NAME\""
            echo "export DEV_MATRIX_ENFORCEMENT_USER_ID=\"$DEV_MATRIX_ENFORCEMENT_USER_ID\""
            echo "export DEV_MATRIX_AS_TOKEN=\"$DEV_MATRIX_AS_TOKEN\""
          } > .env

      - name: dev-tests/run.sh
        working-directory: dev-tests
        run: ./run.sh

  deploy-prod:
    name: Deploy (prod)
    needs: dev-tests
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    # See deploy-dev's identical comment above -- required for npm
    # --provenance.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # See deploy-dev's identical comment above: registry-url stays (needed
      # for the OIDC token request), NODE_AUTH_TOKEN deliberately absent
      # (these packages' Trusted Publishing config rejects token-bearing
      # publishes with a 404).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # See deploy-dev's identical comment above.
      - name: Upgrade npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: scripts/deploy-all.sh prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRESS_CARD_CID: ${{ vars.PRESS_CARD_CID }}
          PRESS_POLICY_CIDS: ${{ vars.PRESS_POLICY_CIDS }}
          PRESS_MLDSA44_PRIVATE_KEY: ${{ secrets.PRESS_MLDSA44_PRIVATE_KEY }}
          PRESS_SECP256R1_PRIVATE_KEY: ${{ secrets.PRESS_SECP256R1_PRIVATE_KEY }}
          PRESS_GAS_WALLET_PRIVATE_KEY: ${{ secrets.PRESS_GAS_WALLET_PRIVATE_KEY }}
          PRESS_OHTTP_PRIVATE_KEY: ${{ secrets.PRESS_OHTTP_PRIVATE_KEY }}
          ARBITRUM_RPC_URL: ${{ vars.ARBITRUM_RPC_URL }}
          # See deploy-dev's identical comment above: split, service-scoped
          # names, not a bare REGISTRY_CONTRACT_ADDRESS.
          REGISTRY_CONTRACT_ADDRESS_LOGIC: ${{ vars.REGISTRY_CONTRACT_ADDRESS_LOGIC }}
          REGISTRY_CONTRACT_ADDRESS_STORAGE: ${{ vars.REGISTRY_CONTRACT_ADDRESS_STORAGE }}
          STORAGE_CONTRACT_ADDRESS: ${{ vars.REGISTRY_CONTRACT_ADDRESS_STORAGE }}
          FILEBASE_KEY: ${{ secrets.FILEBASE_KEY }}
          FILEBASE_SECRET: ${{ secrets.FILEBASE_SECRET }}
          FILEBASE_BUCKET: ${{ vars.FILEBASE_BUCKET }}
          PRESS_ADMIN_API_KEY: ${{ secrets.PRESS_ADMIN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRETS_BACKEND: ${{ vars.SECRETS_BACKEND }}
          WEBCRYPTO_MASTER_KEY: ${{ secrets.WEBCRYPTO_MASTER_KEY }}
          SESSION_TOKEN_SECRET: ${{ secrets.SESSION_TOKEN_SECRET }}
          KV_BACKEND: ${{ vars.KV_BACKEND }}
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          WEBAUTHN_ORIGIN: ${{ vars.WEBAUTHN_ORIGIN }}
          WALLET_SERVICE_ID: ${{ vars.WALLET_SERVICE_ID }}
          WALLET_SERVICE_ENDPOINT: ${{ vars.WALLET_SERVICE_ENDPOINT }}
          WALLET_SERVICE_PRIVATE_KEY: ${{ secrets.WALLET_SERVICE_PRIVATE_KEY }}
          PEER_LIST: ${{ vars.PEER_LIST }}
          RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          DROPLET_SSH_HOST: ${{ secrets.DROPLET_SSH_HOST }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
        run: ./scripts/deploy-all.sh prod
