# main points into .output-cloudflare-module/, not .output/ — nitro.config.ts
# keys the output dir off NITRO_PRESET (`.output-${NITRO_PRESET}`) to avoid the
# cloudflare/node/lambda presets silently overwriting each other's build
# artifact at a shared .output/ path (see nitro.config.ts's comment). This
# file must always build with NITRO_PRESET=cloudflare-module (the default)
# before `wrangler deploy` — scripts/deploy.sh does this — or main below
# won't exist yet.
name = "wallet-service"
main = ".output-cloudflare-module/server/index.mjs"
compatibility_date = "2026-06-29"
compatibility_flags = ["nodejs_compat"]

# WALLET_KV binding backs the wallet-service Nitro storage mount (session
# token revocation, rate-limit counters — see nitro.config.ts, src/kv.ts).
# Operators provision their own KV namespace and set the id here or via
# `wrangler kv namespace create`.
[[kv_namespaces]]
binding = "WALLET_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Per-environment blocks used by scripts/deploy.sh <dev|prod>. Each
# environment gets its own Worker name and its own KV namespace so dev and
# prod state never mix. Provision each namespace with:
#   npx wrangler kv namespace create WALLET_KV --env dev
#   npx wrangler kv namespace create WALLET_KV --env prod
# and replace the id below with the value it prints.
[env.dev]
name = "wallet-service-dev"

[[env.dev.kv_namespaces]]
binding = "WALLET_KV"
id = "77067017e4aa4c3caf60b61acd067623"

[env.prod]
name = "wallet-service-prod"

[[env.prod.kv_namespaces]]
binding = "WALLET_KV"
id = "REPLACE_WITH_PROD_KV_NAMESPACE_ID"
