[workspace]
resolver = "2"
members = ["runtime/crates/notary-types", "runtime/crates/notary-crypto", "runtime/crates/notary-attest", "runtime/crates/notary-worker", "runtime/crates/notary-admission", "runtime/crates/notary-broker", "runtime/crates/notary-cards", "runtime/bin/notary-runtime", "runtime/benches/capacity", "lint", "guest", "sim"]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
