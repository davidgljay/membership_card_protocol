[package]
name = "notary-guest"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Guest-side library for notary_v1 programs (notary_runtime.md §7): the seven ABI imports, input and parameter reading, canonical JSON output of integer/boolean/enum fields, and integer fixed-point arithmetic. no_std, no floats."

[features]
# For a crate that builds a wasm program: a bump allocator and a trapping panic handler (the module is instantiated
# once per run, so memory is never freed).
program = []

[lib]
path = "src/lib.rs"
