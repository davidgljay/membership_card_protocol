# Step 5.5 end to end against the simulator (code-plan §2.2): the host, Redis, the simulated enclave (notary-runtime +
# the fake enclave service), and a simulated chain/IPFS/EAS service in place of Arbitrum One, Kubo and EAS (Phase 7).
# Run it with notary/e2e/run-compose.sh, which also drives the scenario. Every key in e2e/sim.env is a TEST value.
services:
  sim-chain:
    build: { context: ../.., dockerfile: notary/deploy/Dockerfile.e2e }
    image: notary-e2e:dev
    environment: { SIM_CHAIN_PORT: "8545" }
  redis:
    image: redis:7-alpine
  enclave-sim:
    build: { context: .., dockerfile: deploy/Dockerfile.runtime-sim }
    image: notary-runtime-sim:dev
  host:
    build: { context: ../.., dockerfile: notary/deploy/Dockerfile.host }
    image: notary-host:dev
    env_file: ../e2e/sim.env
    environment:
      EXTERNAL_KV_URL: redis://redis:6379
      SIM_CHAIN_URL: http://sim-chain:8545
      ENCLAVE_CIDS: sim-1
      ENCLAVE_ENDPOINTS: "sim-1=enclave-sim:7001"
      NOTARY_PUBLIC_BASE_URL: http://host:3000
    ports: ["3000:3000"]
    depends_on: [redis, enclave-sim, sim-chain]
  driver:
    image: notary-e2e:dev
    profiles: ["driver"]
    env_file: ../e2e/sim.env
    environment:
      HOST_URL: http://host:3000
      SIM_CHAIN_URL: http://sim-chain:8545
      STATE_FILE: /state/e2e-state.json
    volumes: ["e2e-state:/state"]
    entrypoint: ["node", "--experimental-strip-types", "src/driver.ts"]
volumes:
  e2e-state: {}
