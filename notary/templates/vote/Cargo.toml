[package]
name = "notary-template-vote"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The `vote` template program (notary_v1): up to eight options and abstain, one ballot per contributor, counted in fixed slots. Integer only."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
notary-guest = { path = "../../guest", features = ["program"] }

[dev-dependencies]
notary-types = { path = "../../runtime/crates/notary-types" }
serde_json.workspace = true
notary-admission = { path = "../../runtime/crates/notary-admission" }
notary-worker = { path = "../../runtime/crates/notary-worker" }
notary-broker = { path = "../../runtime/crates/notary-broker" }
sha2.workspace = true
