description = "Enclave simulator: test root CA, fake enclave service (attest + controllable clock). Same document format as production; differs only in root and platform (code-plan §2.2)."

[dependencies]
notary-attest = { path = "../runtime/crates/notary-attest", features = ["test-pki"] }
