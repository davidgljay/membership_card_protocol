[package]
name = "notary-attest"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Attestation backends and verifier modules (notary_runtime.md §5, lifecycle Appendix A.1). AWS document parsing lives only in `aws` (G5)."

[features]
default = []
# Produces attestation documents in the AWS format signed by a test PKI. Used by notary/sim and tests only.
test-pki = ["x509-cert/builder"]
# Real NSM backend (/dev/nsm). Linux only; tested in Phase 8.
nsm = ["dep:aws-nitro-enclaves-nsm-api", "dep:serde_bytes"]

[dependencies]
notary-types = { path = "../notary-types" }
ciborium = "0.2"
der = { version = "0.8", features = ["std"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
spki = { version = "0.8", features = ["std"] }
p384 = { version = "0.14", features = ["ecdsa", "sha384", "pkcs8"] }
sha2.workspace = true
# sha2 0.11 is the version p384/ecdsa use; its `oid` feature is needed to build certificates (test-pki)
sha2_11 = { package = "sha2", version = "0.11", features = ["oid"] }
serde_json.workspace = true
aws-nitro-enclaves-nsm-api = { version = "0.5", optional = true }
serde_bytes = { version = "0.11", optional = true }

[dev-dependencies]
notary-attest = { path = ".", features = ["test-pki"] }
