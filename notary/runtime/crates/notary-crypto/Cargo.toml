[package]
name = "notary-crypto"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Notary cryptography: X-Wing draft-06 HPKE, ML-DSA-44 (step 5.1 builds the interop proofs; the rest lands in 5.3)"

[dependencies]
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "chacha", "hkdfsha2", "x25519", "mlkem"] }
x-wing = { version = "=0.1.1", features = ["zeroize"] }
ml-dsa = "=0.1.2"
sha2.workspace = true
serde_json.workspace = true
notary-types = { path = "../notary-types" }

[dev-dependencies]
x-wing = { version = "=0.1.1", features = ["zeroize", "hazmat", "getrandom"] }
rand_core = "0.10"
