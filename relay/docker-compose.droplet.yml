# Droplet-based deployment (dev + prod on one host) — an alternative to
# scripts/deploy.sh's DigitalOcean App Platform path, chosen for cost
# during a low-usage phase. See DEPLOYMENT.md's "Droplet deployment"
# section for the full rationale and prerequisites (Droplet size, DNS,
# Docker/Compose install).
#
# Redis in both environments is deliberately configured with persistence
# disabled (--save "" --appendonly no) — a design requirement, not an
# oversight: message UUID TTL state is expected to be lost on every
# container restart. No volume is mounted for either redis service on
# purpose.
#
# Caddy terminates TLS for both public hostnames (free, auto-renewing
# Let's Encrypt certs — no manual certificate management) and
# reverse-proxies to the right relay container by service name by port.
#
# Unlike the App Platform path, a Droplet's local disk is real persistent
# storage, so — unlike app.dev.yaml's ephemeral /tmp/registry.db — the
# SQLite device registry gets a real volume here and survives restarts.
#
# synapse-dev/synapse-prod: two simultaneously-running Matrix homeservers
# on the same Droplet, same pattern as relay-dev/relay-prod. Each reads
# its own pre-rendered homeserver.yaml/appservice-registration.yaml and
# its own secrets/ directory from wallet-service/matrix/ (see
# DEPLOYMENT.md's "Droplet deployment" section for the one-time generation
# steps that produce the .dev/.prod variants of those files — the
# generation scripts themselves are single-environment-oriented, so this
# split happens by moving their output between two runs, not by any
# runtime dev/prod switch). Each points at its own external Neon Postgres
# (via the pre-rendered homeserver.yaml, not container env vars — psycopg2
# args live inside that file). media/membership-registry storage is a
# per-environment named volume, isolated the same way relay's /data is.
# "prod" services (redis-prod, relay-prod, synapse-prod) are tagged with
# `profiles: ["prod"]` -- deliberately excluded from a plain
# `docker compose up` (even one naming `caddy`, whose own depends_on
# does NOT list them for exactly this reason: Compose implicitly
# activates a dependency's profile if a profile-less service depends on
# it, which would silently defeat the point). Bring the prod tier up
# explicitly, once it's actually ready, with:
#   docker compose -f docker-compose.droplet.yml --profile prod up -d --build
# Caddy doesn't need its proxy targets to already be running to start
# itself -- it just 502s on that route until they exist, so omitting
# them from depends_on costs nothing.
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay-dev
      - synapse-dev

  redis-dev:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  relay-dev:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.dev.droplet
    environment:
      NODE_ENV: production
      RELAY_ID: relay-dev-1
      PORT: "3000"
      REDIS_URL: redis://redis-dev:6379
      UUID_TTL_SECONDS: "2592000"
      DEVICE_REGISTRY_RETENTION_DAYS: "90"
      DELETE_JOB_POLL_INTERVAL_MS: "60000"
      MAX_DELETE_DELAY_SECONDS: "21600"
      DB_PATH: /data/registry.db
      APP_REGISTRY_PATH: /app/config/apps.json
    volumes:
      - relay_dev_data:/data
    depends_on:
      - redis-dev

  redis-prod:
    image: redis:7-alpine
    restart: always
    profiles: ["prod"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  relay-prod:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    profiles: ["prod"]
    env_file:
      - .env.prod.droplet
    environment:
      NODE_ENV: production
      RELAY_ID: relay-prod-1
      PORT: "3000"
      REDIS_URL: redis://redis-prod:6379
      UUID_TTL_SECONDS: "2592000"
      DEVICE_REGISTRY_RETENTION_DAYS: "90"
      DELETE_JOB_POLL_INTERVAL_MS: "60000"
      MAX_DELETE_DELAY_SECONDS: "21600"
      DB_PATH: /data/registry.db
      APP_REGISTRY_PATH: /app/config/apps.json
    volumes:
      - relay_prod_data:/data
    depends_on:
      - redis-prod

  synapse-dev:
    build:
      context: ..
      dockerfile: wallet-service/matrix/Dockerfile
    restart: always
    env_file:
      - .env.dev.droplet
    environment:
      PYTHONUNBUFFERED: "1"
      SYNAPSE_SERVER_NAME: dev.matrix.membershipcard.io
      MATRIX_SERVER_NAME: dev.matrix.membershipcard.io
      MATRIX_ENFORCEMENT_USER_ID: "@matrix-policy-bot:dev.matrix.membershipcard.io"
      MATRIX_MEMBERSHIP_REGISTRY_PATH: /data/membership_registry/registry.enc
      MATRIX_MEMBERSHIP_REGISTRY_KEY_PATH: /data/secrets/membership-registry.key
      JOIN_ATTESTATION_FRESHNESS_SECONDS: "300"
      WATCHER_BACKSTOP_INTERVAL_SECONDS: "3600"
    volumes:
      - ../wallet-service/matrix/homeserver.dev.yaml:/data/homeserver.yaml:ro
      - ../wallet-service/matrix/appservice-registration.dev.yaml:/data/appservice-registration.yaml:ro
      - ../wallet-service/matrix/secrets.dev:/data/secrets:ro
      - synapse_dev_media:/data/media
      - synapse_dev_membership_registry:/data/membership_registry
    command: ["run", "--config-path=/data/homeserver.yaml", "--config-path=/data/secrets/registration-shared-secret.yaml"]
    healthcheck:
      start_period: 5m

  synapse-prod:
    build:
      context: ..
      dockerfile: wallet-service/matrix/Dockerfile
    restart: always
    profiles: ["prod"]
    env_file:
      - .env.prod.droplet
    environment:
      PYTHONUNBUFFERED: "1"
      SYNAPSE_SERVER_NAME: matrix.membershipcard.io
      MATRIX_SERVER_NAME: matrix.membershipcard.io
      MATRIX_ENFORCEMENT_USER_ID: "@matrix-policy-bot:matrix.membershipcard.io"
      MATRIX_MEMBERSHIP_REGISTRY_PATH: /data/membership_registry/registry.enc
      MATRIX_MEMBERSHIP_REGISTRY_KEY_PATH: /data/secrets/membership-registry.key
      JOIN_ATTESTATION_FRESHNESS_SECONDS: "300"
      WATCHER_BACKSTOP_INTERVAL_SECONDS: "3600"
    volumes:
      - ../wallet-service/matrix/homeserver.prod.yaml:/data/homeserver.yaml:ro
      - ../wallet-service/matrix/appservice-registration.prod.yaml:/data/appservice-registration.yaml:ro
      - ../wallet-service/matrix/secrets.prod:/data/secrets:ro
      - synapse_prod_media:/data/media
      - synapse_prod_membership_registry:/data/membership_registry
    command: ["run", "--config-path=/data/homeserver.yaml", "--config-path=/data/secrets/registration-shared-secret.yaml"]
    healthcheck:
      start_period: 5m

volumes:
  caddy_data:
  caddy_config:
  relay_dev_data:
  relay_prod_data:
  synapse_dev_media:
  synapse_dev_membership_registry:
  synapse_prod_media:
  synapse_prod_membership_registry:
